<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exalm — {{.Title}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-thumb { background: var(--scroll, #2a3343); border-radius: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    @keyframes ex-pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes ex-spin { to { transform: rotate(360deg); } }
    button { font-family: inherit; }
    /* Row hover (Log Explorer table rows + Alert cards). */
    .ex-row { transition: background .12s ease; }
    .ex-row:hover { background: var(--panel2) !important; }
    /* Sidebar nav hover. */
    .ex-sidebar nav button:hover { color: var(--fg) !important; }
    /* Responsive: collapse the multi-column page grids. */
    @media (max-width: 1080px) {
      .ex-statcards { grid-template-columns: repeat(2, 1fr) !important; }
      .ex-2col { grid-template-columns: 1fr !important; }
    }
    /* Narrow: collapse the sidebar to an icon rail. */
    @media (max-width: 760px) {
      .ex-sidebar { width: 60px !important; }
      .ex-sidebar nav button span:last-child,
      .ex-sidebar .ex-brand-text { display: none !important; }
      .ex-statcards { grid-template-columns: 1fr 1fr !important; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="ex-overlay"></div>
  <script>
    window.__DASH__ = {{.DashboardJSON}};
    window.__DASH__.canFix = {{if .HasApplyFix}}true{{else}}false{{end}};
    window.__DASH__.canCreatePR = {{if .HasCreatePR}}true{{else}}false{{end}};
  </script>
  <!-- Core dashboard first (it defines window.Exalm), then the feature modules
       that build on it: explainable remediation + investigation panels, chart
       interactivity, and the log viewer. -->
  <script src="/static/dashboard.js"></script>
  <script src="/static/panels.js"></script>
  <script src="/static/chat.js"></script>
  <script src="/static/charts.js"></script>
  <script src="/static/logviewer.js"></script>
</body>
</html>
