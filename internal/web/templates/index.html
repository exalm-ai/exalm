<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exalm — {{.Title}}</title>
  <!-- Fonts: system stacks only. No external requests — matches the
       privacy-first, works-offline promise. -->
  <style>
    :root {
      --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      --font-mono: ui-monospace, "SFMono-Regular", "SF Mono", "Cascadia Code", "Segoe UI Mono", "Roboto Mono", Consolas, "Liberation Mono", monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      letter-spacing: -0.006em;
    }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: var(--scroll, #2a3343); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted, #55617a); background-clip: padding-box; }
    ::-webkit-scrollbar-track { background: transparent; }
    @keyframes ex-pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes ex-spin { to { transform: rotate(360deg); } }
    @keyframes ex-fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    button { font-family: inherit; }
    /* Accessible keyboard focus — a crisp ring on any interactive element,
       suppressed for mouse users. Inline styles rarely set this, so a global
       rule gives every button/input/row a consistent focus affordance. */
    :focus-visible { outline: 2px solid var(--accent, #22b8e6); outline-offset: 2px; border-radius: 6px; }
    [data-act]:focus:not(:focus-visible), button:focus:not(:focus-visible) { outline: none; }
    /* Elevation: cards/panels read as distinct surfaces above the page. The
       SPA builds cards with inline styles; these class hooks add depth + a
       gentle hover lift without touching every builder. */
    .ex-row { transition: background .14s ease, border-color .14s ease, transform .14s ease, box-shadow .14s ease; }
    /* Row / card hover (findings, Log Explorer rows, alert cards): a subtle
       lift + brighter border reads as interactive without being noisy. */
    .ex-row:hover { border-color: var(--accentSoft, #2a3a55) !important; box-shadow: 0 6px 22px rgba(0,0,0,.28) !important; transform: translateY(-1px); }
    /* ── Reusable component classes ──
       A small utility layer replacing the most-repeated inline-style patterns,
       so the look is tuned in one place. Per-instance colors (severity, etc.)
       still ride on inline CSS custom properties. */
    .ex-sec-label { font-size: 10.5px; font-weight: 700; letter-spacing: .7px; text-transform: uppercase; color: var(--faint); }
    .ex-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; box-shadow: 0 1px 2px rgba(0,0,0,.18); }
    .ex-chip { font-size: 9px; font-weight: 700; letter-spacing: .5px; padding: 2px 8px; border-radius: 5px; white-space: nowrap; text-transform: uppercase; line-height: 1.5; }
    .ex-tag { font-size: 9px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; }
    .ex-find-title { font-size: 13px; font-weight: 600; color: var(--fg); margin-top: 7px; line-height: 1.35; }
    .ex-find-meta { font-size: 11.5px; margin-top: 4px; line-height: 1.5; }
    /* Sidebar nav hover. */
    .ex-sidebar nav button:hover { color: var(--fg) !important; }
    /* Responsive: collapse the multi-column page grids. */
    @media (max-width: 1080px) {
      .ex-statcards { grid-template-columns: repeat(2, 1fr) !important; }
      .ex-2col { grid-template-columns: 1fr !important; }
    }
    /* Narrow: collapse the sidebar to an icon rail. */
    @media (max-width: 760px) {
      .ex-sidebar { width: 60px !important; }
      .ex-sidebar nav button span:last-child,
      .ex-sidebar .ex-brand-text { display: none !important; }
      .ex-statcards { grid-template-columns: 1fr 1fr !important; }
    }
    /* AI workspace: stack the tree above the chat on narrow screens. */
    @media (max-width: 900px) {
      .ex-ai-grid { grid-template-columns: 1fr !important; }
      .ex-ai-grid > #ai-tree-root { border-right: none !important; padding-right: 0 !important; max-height: 30vh !important; }
    }
    /* Print / Save-as-PDF: a clean investigation report. Hides the app
       chrome, expands every collapsed section, forces readable colors. */
    @media print {
      body { background: #fff !important; color: #111 !important; }
      .ex-sidebar, footer, .ex-chat-toolbar, .ex-chat-input, .ex-chat-send,
      .ex-chat-sugg, #ex-overlay, button[data-act], .ex-copy { display: none !important; }
      .ex-chat-scroll, #ai-tree-root { max-height: none !important; overflow: visible !important; }
      details { display: block; }
      details > *:not(summary) { display: block !important; }
      details summary { list-style: none; }
      * { box-shadow: none !important; text-shadow: none !important; }
      [style] { background: transparent !important; color: #111 !important; border-color: #ccc !important; }
      pre, code { color: #333 !important; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="ex-overlay"></div>
  <script>
    window.__DASH__ = {{.DashboardJSON}};
    window.__DASH__.canFix = {{if .HasApplyFix}}true{{else}}false{{end}};
    window.__DASH__.canCreatePR = {{if .HasCreatePR}}true{{else}}false{{end}};
  </script>
  <!-- Shared widget library first (charts, tooltips, drill menu — it reads
       window.Exalm lazily), then the dashboard shell (defines window.Exalm),
       then the feature modules that build on both. -->
  <script src="/static/widgets.js"></script>
  <script src="/static/dashboard.js"></script>
  <script src="/static/panels.js"></script>
  <script src="/static/tree.js"></script>
  <script src="/static/chat.js"></script>
  <script src="/static/logexplorer.js"></script>
  <script src="/static/analyzer.js"></script>
  <script src="/static/logviewer.js"></script>
</body>
</html>
